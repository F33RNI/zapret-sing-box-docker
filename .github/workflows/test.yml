name: Docker Image CI (Test)

on:
  push:
    branches: ["main", "warp"]
  pull_request:
    branches: ["main", "warp"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image with current timestamp as tag name
        run: TAG_NAME=$(date +%s) ./build.sh
